[package]
name = "asn-lab/AKeep"
version = "0.2.0"
description = "AKeep Laravel Backend"

[[module]]
name = "akeep-backend"
source = "Dockerfile"
abi = "wasi"

[[command]]
name = "web"
module = "akeep-backend"
entrypoint = "/usr/local/bin/php"
arguments = ["-S", "0.0.0.0:8000", "-t", "public", "public/index.php"]
