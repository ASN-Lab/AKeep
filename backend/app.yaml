name: backend-asn-lab
package: .

fs:
  - .

env:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CLOUDINARY_URL: ${CLOUDINARY_URL}
  CACHE_STORE: array
  SESSION_DRIVER: cookie
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr

command: "/usr/local/bin/php"
arguments: ["-S", "0.0.0.0:8000", "-t", "/app/public", "/app/public/index.php"]
kind: wasmer.io/App.v0
owner: asn-lab
app_id: da_nVEIoteU9D0E
